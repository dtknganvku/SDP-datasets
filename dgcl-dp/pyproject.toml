[build-system]
requires = ["hatchling==1.27.0"]
build-backend = "hatchling.build"

[project]
name = "dgcl-dp"
version = "0.1.0"
description = "Auditable inductive dual-graph defect prediction experiments"
requires-python = ">=3.11,<3.12"
dependencies = [
  "torch==2.5.1", "torch-geometric==2.6.1", "numpy==1.26.4",
  "scipy==1.15.3", "pandas==2.2.3", "scikit-learn==1.7.1",
  "hydra-core==1.3.2", "tree-sitter==0.25.2", "tree-sitter-java==0.23.5",
  "optuna==4.5.0",
  "joblib==1.6.0", "psutil==7.2.2",
]

[project.optional-dependencies]
research = ["transformers==4.51.3", "mlflow==2.22.1", "pydriller==2.9"]

[dependency-groups]
dev = ["pytest==8.3.5", "ruff==0.11.13"]

[project.scripts]
dgcl-audit = "dgcl_dp.audit:main"
dgcl-reproduce = "dgcl_dp.reproduce:main"

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.hatch.build.targets.wheel]
packages = ["src/dgcl_dp"]
